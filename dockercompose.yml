version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ollama-chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  api:
    build: .
    container_name: ollama-chat-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434
      - MODEL_NAME=llama3.2:3b
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data: