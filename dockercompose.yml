version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: ollama-chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

  redis-insight:
    image: redis/redisinsight:latest
    container_name: ollama-chat-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis

  api:
    build: .
    container_name: ollama-chat-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434
      - MODEL_NAME=llama3.2:3b
      - EMBED_MODEL=nomic-embed-text
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_PATH=/data/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chroma_data:/data/chroma_db
      - ./app/backend:/app/app/backend      # fixed path
      - ./app/frontend:/app/app/frontend    # fixed path
    depends_on:
      - redis

volumes:
  redis_data:
  redis_insight_data:
  chroma_data: